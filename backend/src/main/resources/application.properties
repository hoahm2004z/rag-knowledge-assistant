spring.application.name=ai-pharmacy-assistant

# MongoDB — LOCAL dedicated DB only. Never use production pharmacy URI.
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27018/ai_pharmacy_assistant}
spring.data.mongodb.auto-index-creation=true

# Seed business collections when empty (does not touch rag_chunks unless force via admin API separately)
app.seed.enabled=${APP_SEED_ENABLED:true}
app.seed.force=${APP_SEED_FORCE:false}
app.rag.startup-ingest=${APP_RAG_STARTUP_INGEST:true}
app.rag.score-threshold=${APP_RAG_SCORE_THRESHOLD:0.25}
app.rag.debug=${APP_RAG_DEBUG:false}
gemini.rag-top-k=${GEMINI_RAG_TOP_K:4}

# JWT — set JWT_SECRET in backend/.env (Base64, local only; never commit real secret)
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:1440}

# Public store info for getStoreInfo (fictional standalone config)
app.store.name=AI Pharmacy Assistant Store
app.store.address=123 Assistant Lane, Demo City (local seed — not a real pharmacy)
app.store.hotline=1800 000 000
app.store.email=support@aipharmacy.example
app.store.chat-channel=Local demo support channel

# Gemini
gemini.api-key=${GEMINI_API_KEY}
gemini.model=gemini-3.5-flash-lite
gemini.api-url=https://generativelanguage.googleapis.com/v1beta/models/
gemini.max-tokens=2048
gemini.temperature=0.7
gemini.system-prompt=${GEMINI_SYSTEM_PROMPT:You are AI Pharmacy Assistant. Answer in Vietnamese. Use tools for store data and documents. Do not invent prices, stock, or order status.}
gemini.embedding-model=gemini-embedding-001

server.port=${PORT:8080}
